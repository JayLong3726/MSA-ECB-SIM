<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECB Training Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <div class="brand">ECB TRAINING SIMULATOR</div>
  <div class="appbar-right">LOCAL SESSION · ECB-ALPHA</div>
</header>

<main class="workspace">
  <section class="m1-shell" aria-label="MSA Entry Control Board training display">
    <div class="m1-screen">
      <div class="m1-top">
        <button class="menu-button" aria-label="Menu">
          <i></i><i></i><i></i>
        </button>
        <div class="header-copy">
          <div class="ecp-name">ECP ALPHA</div>
          <div class="clock" id="clock">13:14</div>
        </div>
        <div class="battery">BAT <span id="battery">100</span>%</div>
      </div>

      <div class="screen-body">
        <div class="slot-list" id="slots"></div>
      </div>
    </div>
  </section>
</main>

<script src="simulator.js"></script>
</body>
</html>
