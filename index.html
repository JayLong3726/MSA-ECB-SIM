<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECB Training Simulator</title>
<style>
  * { box-sizing: border-box; }

  :root{
    --screen:#5b6063;
    --slot:#878d8f;
    --white:#f3f4f4;
    --navy:#071118;
    --red:#ed1c24;
  }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--navy);
    font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  }

  body{
    color:white;
    overflow-x:hidden;
  }

  /* Simple simulator wrapper around the replica */
  .sim-header{
    height:56px;
    background:#084b6d;
    border-bottom:3px solid var(--red);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    font-weight:700;
    font-size:15px;
  }

  .sim-header-right{
    font-size:12px;
  }

  .stage{
    min-height:calc(100vh - 56px);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 12px 30px;
  }

  .device{
    width:min(650px,96vw);
    background:#050505;
    border:1px solid #1c1f20;
    border-radius:7px;
    padding:9px;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
  }

  .screen{
    width:100%;
    background:#f2f3f3;
    overflow:hidden;
  }

  .top{
    height:142px;
    background:var(--screen);
    position:relative;
    display:flex;
    align-items:flex-start;
    padding:21px 34px;
  }

  .hamburger{
    width:34px;
    margin-right:17px;
    padding-top:5px;
  }

  .hamburger span{
    display:block;
    height:4px;
    width:28px;
    background:#fff;
    margin-bottom:6px;
  }

  .time{
    font-size:38px;
    font-weight:300;
    line-height:42px;
    letter-spacing:-1px;
  }

  .battery{
    position:absolute;
    top:26px;
    right:25px;
    font-size:14px;
    font-weight:700;
  }

  .content{
    background:#f1f2f2;
    padding:10px 7px 7px;
  }

  .slot{
    height:calc((100vh - 56px - 142px - 55px) / 6);
    min-height:100px;
    max-height:145px;
    margin-bottom:7px;
    border-radius:11px;
    background:var(--slot);
    display:grid;
    grid-template-columns:76px 1fr;
    align-items:center;
    color:#fff;
  }

  .slot-number{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:300;
  }

  .slot-label{
    font-size:26px;
    font-style:italic;
    font-weight:300;
    padding-left:9px;
    white-space:nowrap;
  }

  .bottom{
    height:50px;
    background:#050505;
  }

  @media(max-width:700px){
    .sim-header{
      height:50px;
      padding:0 16px;
      font-size:13px;
    }

    .sim-header-right{display:none}

    .stage{
      min-height:calc(100vh - 50px);
      padding:0;
      align-items:flex-start;
    }

    .device{
      width:100%;
      max-width:650px;
      border:0;
      border-radius:0;
      padding:0;
      box-shadow:none;
    }

    .top{
      height:142px;
      padding:22px 31px;
    }

    .time{font-size:37px}

    .content{
      padding:11px 8px 8px;
    }

    .slot{
      height:calc((100vh - 50px - 142px - 55px) / 6);
      min-height:108px;
      margin-bottom:8px;
      border-radius:11px;
      grid-template-columns:76px 1fr;
    }

    .slot-number{font-size:31px}
    .slot-label{font-size:26px}
  }
</style>
</head>

<body>
  <header class="sim-header">
    <div>ECB TRAINING SIMULATOR</div>
    <div class="sim-header-right">ECP-ALPHA</div>
  </header>

  <main class="stage">
    <section class="device">
      <div class="screen">

        <header class="top">
          <div class="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="time" id="clock">07:28</div>

          <div class="battery">43% ▣</div>
        </header>

        <section class="content">
          <div class="slot"><div class="slot-number">1</div><div class="slot-label">Slot Available</div></div>
          <div class="slot"><div class="slot-number">2</div><div class="slot-label">Slot Available</div></div>
          <div class="slot"><div class="slot-number">3</div><div class="slot-label">Slot Available</div></div>
          <div class="slot"><div class="slot-number">4</div><div class="slot-label">Slot Available</div></div>
          <div class="slot"><div class="slot-number">5</div><div class="slot-label">Slot Available</div></div>
          <div class="slot"><div class="slot-number">6</div><div class="slot-label">Slot Available</div></div>
        </section>

        <div class="bottom"></div>
      </div>
    </section>
  </main>

<script>
  // Keep the visual starting state fixed to the supplied reference.
  // The functionality will be added only after this baseline is approved.
  document.getElementById("clock").textContent = "07:28";
</script>
</body>
</html>
